  .player-row input {

  }

  .player-row select {

    border: none;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font-size: 1rem;
    text-align: center;

function renderPlayers() {
  const container = document.getElementById("players");
  container.innerHTML = "";
  players.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "player-row";
    div.innerHTML = `
      <input placeholder="Name" value="${p.name}" onchange="players[${i}].name=this.value">
      <select onchange="players[${i}].gender=this.value">
        <option value="male" ${p.gender==='male'?'selected':''}>Male</option>
        <option value="female" ${p.gender==='female'?'selected':''}>Female</option>
      </select>
    `;
    container.appendChild(div);
  });
}

function startGame() {
  players = players.filter(p => p.name.trim());

    alert("Add at least 2 participants");
    return;
  }
  mode = document.querySelector('.mode-option.selected').dataset.mode;
  mood = document.querySelector('.mood-option.selected').dataset.mood;

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("turn").classList.remove("hidden");
  updateModeBadge();
  nextTurn();
}

function updateModeBadge() {

}

function nextTurn() {

  document.getElementById("turn").classList.remove("hidden");

  let i;

  while (i === lastIndex && players.length > 1);

  currentIndex = i;
  turnCount++;

  const p = players[i];
  const genderTag = p.gender === 'male'
    ? '<span class="gender-tag male">♂ Male</span>'
    : '<span class="gender-tag female">♀ Female</span>';

  document.getElementById("turnCounter").innerText = "Round " + turnCount;
  document.getElementById("currentPlayer").innerHTML = p.name + " " + genderTag;
  updateScoreTable();
}

function choose(type) {
  const p = players[currentIndex];

  const prompt = list[Math.floor(Math.random() * list.length)];

  if (type === 'truth') p.truths++;
  else p.dares++;

  document.getElementById("promptText").innerText = prompt;
  document.getElementById("turn").classList.add("hidden");
  document.getElementById("promptScreen").classList.remove("hidden");
  updateScoreTable();
}

function updateScoreTable() {
  const tbody = document.getElementById("scoreTable");
  tbody.innerHTML = "";
  players.forEach(p => {
    tbody.innerHTML += `<tr>
      <td>${p.name}</td>
      <td>${p.truths}</td>
      <td>${p.dares}</td>
      <td>${p.truths + p.dares}</td>
    </tr>`;
  });
}

function backToSetup() {
  document.getElementById("turn").classList.add("hidden");

  document.getElementById("setup").classList.remove("hidden");
  turnCount = 0;
  lastIndex = -1;
  players.forEach(p => { p.truths = 0; p.dares = 0; });
