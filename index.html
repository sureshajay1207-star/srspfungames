<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Game Night – Dual Mode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg-color: #121010;
    --card-bg: rgba(28, 24, 24, 0.7);
    --border-color: rgba(212, 163, 115, 0.15);
    --border-hover: rgba(212, 163, 115, 0.4);
    --text-primary: #f5f0eb;
    --text-secondary: #b8aba2;
    --accent-gold: #d4a373;
  }

  body {
    margin: 0;
    font-family: 'Plus Jakarta+Sans', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    box-sizing: border-box;
  }

  .wrapper {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0 0 12px 0;
    color: var(--text-primary);
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-secondary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 300;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    width: 100%;
  }

  /* Make the first two cards on the bottom row center nicely or span */
  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }

  .game-card:hover {
    transform: translateY(-6px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }

  .card-image-wrapper {
    width: 100%;
    height: 180px;
    overflow: hidden;
  }

  .game-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.9) contrast(1.05);
    transition: transform 0.5s ease;
  }

  .game-card:hover img {
    transform: scale(1.04);
  }

  .game-title {
    padding: 20px 16px;
    text-align: center;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--text-primary);
    background: transparent;
  }

  /* Spanning layout adjustments for 5 cards */
  .game-card:nth-child(4) {
    grid-column: 1 / 2;
  }
  .game-card:nth-child(5) {
    grid-column: 3 / 4;
  }
  
  .bottom-row-wrapper {
    display: contents;
  }

  @media (max-width: 900px) {
    .grid-container {
      grid-template-columns: repeat(2, 1fr);
    }
    .game-card:nth-child(4),
    .game-card:nth-child(5) {
      grid-column: auto;
    }
  }

  @media (max-width: 600px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
    h1 {
      font-size: 2.2rem;
    }
  }
</style>
</head>
<body>

<div class="wrapper">
  <header>
    <h1>Private Game Night</h1>
    <div class="subtitle">SRSP &amp; SRDP &bull; Gender-Aware &bull; Consent First</div>
  </header>

  <div class="grid-container">
    <div class="game-card" onclick="go('Truthdare.html')">
      <div class="card-image-wrapper">
        <img src="https://www.wikihow.com/images/thumb/1/1e/Intimate-Questions-to-Ask-Your-Partner-Step-9-Version-2.jpg/v4-728px-Intimate-Questions-to-Ask-Your-Partner-Step-9-Version-2.jpg" alt="Truth or Dare">
      </div>
      <div class="game-title">Truth or Dare Ladder</div>
    </div>

    <div class="game-card" onclick="go('dice.html')">
      <div class="card-image-wrapper">
        <img src="https://www.girlschase.com/images/sex-tactics.jpg" alt="Desire Dice">
      </div>
      <div class="game-title">Desire Dice</div>
    </div>

    <div class="game-card" onclick="go('connection.html')">
      <div class="card-image-wrapper">
        <img src="https://www.developgoodhabits.com/wp-content/uploads/2020/02/questions-couples-fantasy.png" alt="Connection Questions">
      </div>
      <div class="game-title">Connection Questions</div>
    </div>

    <div class="game-card" onclick="go('secret.html')">
      <div class="card-image-wrapper">
        <img src="https://i.etsystatic.com/62191748/r/il/870382/7303613538/il_fullxfull.7303613538_m7zg.jpg" alt="Secret Challenge">
      </div>
      <div class="game-title">Secret Challenge</div>
    </div>

    <div class="game-card" onclick="go('tempo.html')">
      <div class="card-image-wrapper">
        <img src="https://helios-i.mashable.com/imagery/articles/06vhR6V3ub2Qfp3quuSkbuo/hero-image.fill.size_1248x702.v1623389712.jpg" alt="Tempo Game">
      </div>
      <div class="game-title">Tempo Game</div>
    </div>
  </div>
</div>

<script>
function go(page) { window.location.href = page; }
</script>
</body>
</html>
